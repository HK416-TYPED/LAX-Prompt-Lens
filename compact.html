<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAX Prompt Lens · 小窗</title>
    <link rel="stylesheet" href="compact.css">
  </head>
  <body>
    <main class="compact-shell">
      <header>
        <div class="mini-mark" aria-hidden="true"><span>L</span><span>A</span><span>X</span></div>
        <div class="brand-copy">
          <p>LAX / QUICK TERMINAL</p>
          <h1>PROMPT LENS</h1>
        </div>
        <button id="full-mode-button" class="mode-button" type="button">完整版 ↗</button>
      </header>

      <section class="compact-card">
        <div class="field-label"><span id="input-label">01 / POST URL</span><span id="version">v—</span></div>
        <div class="source-mode-switch" role="group" aria-label="输入模式">
          <button type="button" data-source-mode="url" aria-pressed="true">帖子 URL</button>
          <button type="button" data-source-mode="manual" aria-pressed="false">手动文本</button>
        </div>
        <div id="url-input-panel">
          <input id="post-url" type="url" spellcheck="false" autocomplete="off" placeholder="粘贴 Danbooru 帖子链接…">
        </div>
        <div id="manual-input-panel" class="is-hidden">
          <textarea id="manual-text" maxlength="12000" spellcheck="true" placeholder="输入中文或英文画面描述…"></textarea>
          <div class="manual-detail-mode" role="group" aria-label="提示词细节模式">
            <span>细节模式</span>
            <div class="detail-mode-switch">
              <button type="button" data-manual-detail-mode="simple" aria-pressed="true">简</button>
              <button type="button" data-manual-detail-mode="detailed" aria-pressed="false">繁</button>
            </div>
          </div>
        </div>

        <button id="generate-button" class="generate-button" type="button">
          <span aria-hidden="true">✦</span> 生成 TAG + NL
        </button>

        <button id="copy-button" class="copy-button" type="button" disabled>
          复制组合提示词
        </button>

        <div id="status" class="status" data-state="idle" aria-live="polite">
          <i></i><span id="status-text">等待粘贴链接</span>
        </div>
        <p class="data-note">生成内容会发送到完整版中选择的 API。</p>
        <p id="result-meta" class="result-meta is-hidden">—</p>
      </section>

      <footer><span>USES SAVED FULL-MODE SETTINGS</span><b>ONLINE</b></footer>
    </main>
    <script type="module" src="compact.js"></script>
  </body>
</html>
